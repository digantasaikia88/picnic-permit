# Picnic Portal: single entry point in production.
#   /api/...  -> backend (FastAPI)
#   /         -> frontend (Next.js)
# Mounted as /etc/nginx/conf.d/default.conf in the nginx-unprivileged image,
# which listens on 8080 as a non-root user.

upstream backend {
    server backend:8000;
    keepalive 16;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;

    # Uploads are limited to 5 MB per file (PRD Section 13.4); allow a little headroom.
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Liveness of Nginx itself, for the container health check.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    # Build output with hashed file names: safe to cache for a long time.
    location /_next/static/ {
        proxy_pass http://frontend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://frontend;
    }
}
