# Production: docker compose -f compose.prod.yaml up -d --build
# Needs a .env file (copy .env.example and fill it in). Only Nginx publishes a port.

name: picnic-permit

services:
  db:
    image: postgres:18.7-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - db_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $$POSTGRES_USER --dbname $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      UPLOAD_DIR: /data/uploads
      MASTERS_DIR: /masters
      # Address of the site as the public reaches it. Used in links sent by SMS.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      # Send the login cookie only over HTTPS. Set to true as soon as the site has HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - uploads:/data/uploads
      # Master CSV files, read by: python -m app.seeds.load_masters
      - ./docs/masters:/masters:ro
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-trixie
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # The only published port. The image runs as a non-root user and listens on 8080.
      - "${HTTP_PORT:-80}:8080"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  internal:

volumes:
  db_data:
  uploads:
